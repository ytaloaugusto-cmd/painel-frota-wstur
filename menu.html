<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garagem WS — Menu</title>
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#0f1720;
    color:#f1f5f9;
    padding:24px;
  }
  .wrap{width:100%;max-width:460px;text-align:center}
  h1{font-size:1.5rem;margin:0 0 8px}
  p.sub{color:#94a3b8;margin:0 0 32px;font-size:.95rem}
  .cards{display:flex;flex-direction:column;gap:16px}
  a.card{
    display:block;
    background:#1e293b;
    border:1px solid #334155;
    border-radius:14px;
    padding:22px 20px;
    text-decoration:none;
    color:inherit;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  a.card:hover{transform:translateY(-2px);border-color:#3b82f6;background:#233248}
  a.card .title{font-size:1.1rem;font-weight:600;margin-bottom:4px}
  a.card .desc{font-size:.85rem;color:#94a3b8}
</style>
</head>
<body>
<div class="wrap">
  <h1>Garagem WS Tur</h1>
  <p class="sub">Escolha um painel para acessar</p>
  <div class="cards">
    <a class="card" href="index.html">
      <div class="title">🔧 Painel de Manutenção</div>
      <div class="desc">Inventário, gráficos e manutenção preventiva da frota</div>
    </a>
    <a class="card" href="busca.html">
      <div class="title">📋 Painel de Ficha Técnica</div>
      <div class="desc">Consulta e busca de dados dos veículos</div>
    </a>
  </div>
</div>
</body>
</html>
