<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frota WS Receptivo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;font-size:14px;color:#1a1a1a;background:#f4f6f9;min-height:100vh}
header{background:#1A3A5C;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
header h1{font-size:16px;font-weight:600}
header span{font-size:12px;opacity:.7;margin-left:auto}
.container{padding:16px 20px;max-width:1100px;margin:0 auto}

/* KPIs */
.kpis{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.kpi{background:#fff;border-radius:8px;padding:10px 16px;flex:1;min-width:110px;border:.5px solid #dde3ec}
.kpi-label{font-size:11px;color:#666;margin-bottom:3px}
.kpi-val{font-size:22px;font-weight:600;color:#1A3A5C}

/* busca */
.search-row{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.search-wrap{position:relative;flex:1}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#999;pointer-events:none}
.search-wrap input{width:100%;padding:9px 12px 9px 34px;font-size:14px;border:.5px solid #ccc;border-radius:8px;background:#fff;outline:none;transition:border .15s}
.search-wrap input:focus{border-color:#2a6099;box-shadow:0 0 0 2px rgba(42,96,153,.12)}
.btn-clear{padding:8px 14px;border-radius:8px;border:.5px solid #ccc;background:#fff;color:#666;font-size:13px;cursor:pointer}
.btn-clear:hover{border-color:#999;color:#333}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:.5px solid #ccc;background:#fff;color:#555;font-size:12px;cursor:pointer;transition:all .15s;user-select:none}
.chip:hover{border-color:#2a6099;color:#2a6099}
.chip.active{background:#1A3A5C;border-color:#1A3A5C;color:#fff}
.chip svg{flex-shrink:0}

/* tabela */
.card{background:#fff;border-radius:10px;border:.5px solid #dde3ec;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#1A3A5C;color:#fff;font-weight:500;padding:9px 11px;text-align:left;font-size:11px;letter-spacing:.04em;white-space:nowrap}
td{padding:7px 11px;border-bottom:.5px solid #eef0f3;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f7f9fc}
.frota-num{font-weight:700;color:#1A3A5C}
.placa{font-family:monospace;font-size:12px;background:#eef0f3;padding:2px 6px;border-radius:4px;letter-spacing:.07em}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500}
.b-rod{background:#dae3f3;color:#1A3A5C}
.b-micro{background:#e2efda;color:#1B5E20}
.b-van{background:#fce4d6;color:#7F3F00}
.b-car{background:#f2f2f2;color:#444}
.b-cam{background:#f3e4f6;color:#6A1B9A}
.b-antt{background:#e6f4ea;color:#1B5E20;font-weight:600}
.motor-tag{color:#555;font-size:12px}
.dim{color:#888;font-size:12px}


.footer{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:12px;color:#888}
.no-results{text-align:center;padding:2.5rem;color:#999;font-size:13px}
</style>
</head>

document.getElementById('k-micro').textContent=FROTA.filter(v=>v.cat==='Micro-ônibus').length;
document.getElementById('k-van').textContent=FROTA.filter(v=>v.cat==='Van').length;
document.getElementById('k-car').textContent=FROTA.filter(v=>v.cat==='Carro / utilitário').length;


function setCat(el,cat){
  activeCat=cat;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  render();
}

function clearSearch(){
  document.getElementById('q').value='';
  render();
}

function render(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  let data=FROTA.filter(v=>{
    if(activeCat && v.cat!==activeCat) return false;
    if(!q) return true;
    return v.f.toLowerCase().includes(q)||v.p.toLowerCase().includes(q)||
           v.m.toLowerCase().includes(q)||v.mot.toLowerCase().includes(q);
  });
  const tbody=document.getElementById('tbody');
  if(!data.length){
    tbody.innerHTML='<tr><td colspan="9" class="no-results">Nenhum veículo encontrado para essa busca.</td></tr>';
  } else {
    tbody.innerHTML=data.map(v=>`<tr>
      <td class="frota-num">${v.f}</td>
      <td><span class="placa">${v.p}</span></td>
      <td>${v.m}</td>
      <td>${catBadge[v.cat]||v.cat}</td>
      <td class="motor-tag">${v.mot}</td>
      <td class="dim">${v.cv} cv</td>
      <td class="dim">${v.cap}P</td>
      <td class="dim">${v.emp}</td><td>${v.antt?'<span class="badge b-antt">ANTT</span>':''}</td>
    </tr>`).join('');
  }
  document.getElementById('count').textContent=`${data.length} de ${FROTA.length} veículos`;
}
